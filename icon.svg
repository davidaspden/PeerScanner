<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Barcode Vertical Bars in Background/Center -->
  <rect x="5" y="4" width="2" height="10" rx="0.5" fill="url(#primaryGrad)" opacity="0.9"/>
  <rect x="9" y="4" width="3.5" height="10" rx="0.5" fill="url(#primaryGrad)" opacity="0.9"/>
  <rect x="14.5" y="4" width="1.5" height="10" rx="0.5" fill="url(#primaryGrad)" opacity="0.9"/>
  <rect x="18" y="4" width="3" height="10" rx="0.5" fill="url(#primaryGrad)" opacity="0.9"/>
  <rect x="23" y="4" width="1.5" height="10" rx="0.5" fill="url(#primaryGrad)" opacity="0.9"/>
  <rect x="26.5" y="4" width="2" height="10" rx="0.5" fill="url(#primaryGrad)" opacity="0.9"/>

  <!-- Optical Scan Line -->
  <line x1="3" y1="9" x2="29" y2="9" stroke="url(#scanGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left User (Host / Broadcaster) -->
  <!-- Head -->
  <circle cx="10" cy="18" r="3.2" fill="#38bdf8"/>
  <!-- Body/Shoulders -->
  <path d="M 4 28 C 4 23.5 7 22.5 10 22.5 C 13 22.5 16 23.5 16 28 Z" fill="#38bdf8" opacity="0.95"/>

  <!-- Right User (Client / Receiver) -->
  <!-- Head -->
  <circle cx="22" cy="18" r="3.2" fill="#60a5fa"/>
  <!-- Body/Shoulders -->
  <path d="M 16 28 C 16 23.5 19 22.5 22 22.5 C 25 22.5 28 23.5 28 28 Z" fill="#60a5fa" opacity="0.95"/>
</svg>
